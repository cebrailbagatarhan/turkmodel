# training_config.yaml — 2 Saat H100 Eğitim Konfigürasyonu
# ============================================================
# ~6B model + 400 iterasyon + 8-bit Adam ile H100 80GB'ye optimize
# Overfit'i önlemek için 300-400 step yeterli
# ============================================================

model:
  type: "llama"
  size: "~6B"
  vocab_size: 50257
  hidden_size: 4096
  intermediate_size: 11008
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 8
  max_position_embeddings: 2048
  dtype: "bfloat16"
  flash_attention: true

training:
  max_steps: 400                   # 300-400 yeterli, fazlası overfit yapar
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  # Efektif batch: 4 * 4 * 2048 = ~32K token/adım
  # 400 adım * 32K = ~13M token
  
  learning_rate: 3.0e-4            # 6-7B model için standart LR
  lr_scheduler_type: "cosine"
  warmup_steps: 40
  min_lr: 3.0e-5
  weight_decay: 0.1
  max_grad_norm: 1.0
  
  optimizer: "adamw_bnb_8bit"      # 8-bit Adam — VRAM tasarrufu
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  
  bf16: true
  tf32: true
  gradient_checkpointing: true
  
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 5
  
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  seq_length: 2048

data:
  mix:
    turkish: 0.40
    english: 0.55
    code: 0.05
  total_tokens_target: "13M"

memory_estimate:
  bf16_weights: "~12.2 GB"
  gradients: "~12.2 GB"
  optimizer_8bit: "~12.2 GB"
  activations_with_checkpointing: "~5-8 GB"
  total: "~42 GB / 80 GB H100"
