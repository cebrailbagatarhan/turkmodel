# training_config.yaml — 2 Saat H100 Eğitim Konfigürasyonu
# ============================================================
# Bu dosya 350M model + 2 saat H100 süresine göre optimize edilmiştir.
# 8B model için değerleri _8b_reference altında bulabilirsiniz.
# ============================================================

model:
  type: "llama"
  size: "350M"
  vocab_size: 32000
  hidden_size: 1024
  intermediate_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 2048
  dtype: "bfloat16"
  flash_attention: true

training:
  # 2 saat H100'de ~500M-1B token işlenebilir
  max_steps: 5000
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 8
  # Efektif batch: 16 * 8 * 2048 = ~262K token/adım
  # 5000 adım * 262K = ~1.3B token
  
  learning_rate: 6.0e-4          # Küçük model → daha yüksek LR
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  min_lr: 6.0e-5
  weight_decay: 0.1
  max_grad_norm: 1.0
  
  optimizer: "adamw_torch_fused"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  
  bf16: true
  tf32: true
  gradient_checkpointing: true
  
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 5
  
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  seq_length: 2048

data:
  mix:
    turkish: 0.40
    english: 0.55
    code: 0.05
  total_tokens_target: "1B"

# 8B model referans değerleri (orijinal plan)
_8b_reference:
  max_steps: 50000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 128
  learning_rate: 3.0e-4
  warmup_steps: 2000
  seq_length: 4096
  total_tokens_target: "100B"
  estimated_time: "60-80 gün (tek H100)"
