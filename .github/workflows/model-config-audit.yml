name: Model config structure audit

on:
  pull_request:
    paths:
      - "llm-8b-tr-en/configs/audit_model_config.py"
      - "llm-8b-tr-en/configs/model_config.json"
      - "tests/test_model_config_audit.py"
      - ".github/workflows/model-config-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q llm-8b-tr-en/configs/audit_model_config.py tests/test_model_config_audit.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit checked-in model config
        run: python llm-8b-tr-en/configs/audit_model_config.py --json
